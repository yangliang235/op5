name: Build OP5T Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 准备环境
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison

    - name: 下载 Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        # 使用适配 4.4 内核的经典 Android Clang 版本
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r353375c.tar.gz
        tar -xf clang-r353375c.tar.gz

    - name: 编译内核
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 使用你指定的 OP5-perf_defconfig
        make O=out OP5-perf_defconfig
        
        make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: 打包刷机包
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cd AnyKernel3
        # 针对 5T (dumpling) 的配置
        sed -i 's/device.name1=.*/device.name1=dumpling/' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=cheeseburger/' anykernel.sh
        sed -i 's|block=.*/|block=/dev/block/bootdevice/by-name/boot|' anykernel.sh
        
        # 1. 检查生成的镜像文件名。如果是 Image.gz-dtb 请改名
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb .
        else
            cp ../out/arch/arm64/boot/Image.gz .
        fi
        
        zip -r9 ../OP5T-ZRAM-Update.zip *

    - name: 发布结果
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus5T-Kernel
        path: OP5T-ZRAM-Update.zip
