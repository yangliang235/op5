name: Build OnePlus-MSM8998-Kernel-ReKernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "op5-perf_defconfig"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Remove unnecessary files to free space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies & Download Modern Clang (Proton Clang)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev zip ccache libelf-dev wget git binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          # 下载支持现代 CPU 架构参数的 Proton Clang
          mkdir -p clang
          cd clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
          cd ..

          # 下载 LineageOS GCC 4.9 交叉编译工具链
          mkdir -p toolchain
          cd toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32 --depth=1

      - name: Inject Re:Kernel Source and Patch Kernel
        run: |
          mkdir -p drivers/rekernel
          cat << 'EOF' > drivers/rekernel/rekernel.h
          #ifndef _REKERNEL_H
          #define _REKERNEL_H

          #include <linux/init.h>
          #include <linux/types.h>
          #include <net/sock.h>
          #include <linux/netlink.h>
          #include <linux/proc_fs.h>
          #include <linux/freezer.h>
          #include <linux/sched.h>

          #ifndef JOBCTL_TRAP_FREEZE
          #define JOBCTL_TRAP_FREEZE 0x10000
          #endif

          #define NETLINK_REKERNEL_MAX         26
          #define NETLINK_REKERNEL_MIN         22
          #define USER_PORT                    100
          #define PACKET_SIZE                  128
          #define MIN_USERAPP_UID              (10000)
          #define MAX_SYSTEM_UID               (2000)
          #define RESERVE_ORDER                17
          #define WARN_AHEAD_SPACE             (1 << RESERVE_ORDER)

          static struct sock *rekernel_netlink = NULL;
          extern struct net init_net;
          static int netlink_unit = NETLINK_REKERNEL_MIN;

          static inline bool line_is_frozen(struct task_struct *task)
          {
              return frozen(task->group_leader) || freezing(task->group_leader);
          }

          static int send_netlink_message(char *msg, uint16_t len) {
              struct sk_buff *skbuffer;
              struct nlmsghdr *nlhdr;

              skbuffer = nlmsg_new(len, GFP_ATOMIC);
              if (!skbuffer) {
                  return -1;
              }

              nlhdr = nlmsg_put(skbuffer, 0, 0, netlink_unit, len, 0);
              if (!nlhdr) {
                  nlmsg_free(skbuffer);
                  return -1;
              }

              memcpy(nlmsg_data(nlhdr), msg, len);
              return netlink_unicast(rekernel_netlink, skbuffer, USER_PORT, MSG_DONTWAIT);
          }

          static void netlink_rcv_msg(struct sk_buff *skbuffer) { }

          static struct netlink_kernel_cfg rekernel_cfg = { 
              .input = netlink_rcv_msg,
          };

          static int rekernel_unit_show(struct seq_file *m, void *v)
          {
              seq_printf(m, "%d\n", netlink_unit);
              return 0;
          }

          static int rekernel_unit_open(struct inode *inode, struct file *file)
          {
              return single_open(file, rekernel_unit_show, NULL);
          }

          static const struct file_operations rekernel_unit_fops = {
              .open   = rekernel_unit_open,
              .read   = seq_read,
              .llseek = seq_lseek,
              .release= single_release,
              .owner  = THIS_MODULE,
          };

          static struct proc_dir_entry *rekernel_dir, *rekernel_unit_entry;

          static int start_rekernel_server(void) {
            if (rekernel_netlink != NULL)
              return 0;
            for (netlink_unit = NETLINK_REKERNEL_MIN; netlink_unit < NETLINK_REKERNEL_MAX; netlink_unit++) {
              rekernel_netlink = (struct sock *)netlink_kernel_create(&init_net, netlink_unit, &rekernel_cfg);
              if (rekernel_netlink != NULL)
                break;
            }
            if (rekernel_netlink == NULL) {
              return -1;
            }
            rekernel_dir = proc_mkdir("rekernel", NULL);
            if (rekernel_dir) {
                char buff[32];
                sprintf(buff, "%d", netlink_unit);
                rekernel_unit_entry = proc_create(buff, 0644, rekernel_dir, &rekernel_unit_fops);
            }
            return 0;
          }
          #endif
          EOF

          echo "obj-y := rekernel.o" > drivers/rekernel/Makefile
          touch drivers/rekernel/rekernel.c

          if ! grep -q "rekernel" drivers/Makefile; then
              echo "obj-\$(CONFIG_ANDROID) += rekernel/" >> drivers/Makefile
          fi

          echo "Re:Kernel injected successfully."

      - name: Configure & Compile Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 设定使用 Proton Clang 编译器的完整参数（精确指定 binutils 路径避免报错）
          export KERNEL_CMDLINE="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$(pwd)/toolchain/gcc64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$(pwd)/toolchain/gcc32/bin/arm-linux-androideabi-"

          # 1. 彻底清空残余
          rm -rf out/
          make mrproper
          make distclean

          # 2. 创建输出目录并载入配置
          mkdir -p out
          make $KERNEL_CMDLINE $KERNEL_DEFCONFIG

          # 3. 开启必要宏
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/g' out/.config
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/g' out/.config
          sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/g' out/.config
          sed -i 's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/g' out/.config
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' out/.config
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/g' out/.config
          sed -i 's/# CONFIG_ZRAM is not set/CONFIG_ZRAM=y/g' out/.config
          sed -i 's/# CONFIG_ZRAM_WRITEBACK is not set/CONFIG_ZRAM_WRITEBACK=y/g' out/.config
          sed -i 's/# CONFIG_ZRAM_MEMORY_TRACKING is not set/CONFIG_ZRAM_MEMORY_TRACKING=y/g' out/.config
          sed -i 's/# CONFIG_SWAP is not set/CONFIG_SWAP=y/g' out/.config

          make $KERNEL_CMDLINE olddefconfig
          
          # 4. 开始多核并行编译
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Prepare AnyKernel3 & Package Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3

          sed -i 's/device.name1=/device.name1=cheeseburger/g' anykernel.sh
          sed -i 's/device.name2=/device.name2=dumpling/g' anykernel.sh
          sed -i 's/device.name3=/device.name3=OnePlus5/g' anykernel.sh
          sed -i 's/device.name4=/device.name4=OnePlus5T/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.1/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh

          cp ../out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb

          rm -rf .git
          ZIP_NAME="blu_spark_ReKernel_OP5_5T_$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "$ZIP_NAME" * -x README.md *placeholder

          echo "ZIP_PATH=AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
