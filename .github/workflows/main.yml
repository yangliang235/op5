name: Build OP5 Recovery Flashable Zip (GCC 11 + Swappiness 200 + APatch/KPM Ready)

on:
  workflow_dispatch:
  push:
    branches: [ blu_spark-10 ]

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: blu_spark_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host dependencies and GCC 11
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 cpio device-tree-compiler \
            gcc-11-aarch64-linux-gnu gcc-11-arm-linux-gnueabi

          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-11 100
          sudo update-alternatives --install /usr/bin/arm-linux-gnueabi-gcc arm-linux-gnueabi-gcc /usr/bin/arm-linux-gnueabi-gcc-11 100

      - name: Patch source (swappiness = 200)
        run: |
          # 1. 修改内存扫描源码中的默认 vm_swappiness
          sed -i 's/^int vm_swappiness = 60;/int vm_swappiness = 200;/' mm/vmscan.c
          grep -q '^int vm_swappiness = 200;' mm/vmscan.c || { echo "::error::swappiness 默认值修改失败"; exit 1; }

          # 2. 修改 sysctl 上限，允许调整到 200
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path("kernel/sysctl.c")
          s = p.read_text()
          if "two_hundred" not in s:
              s = re.sub(r"(static int one_hundred\s*=\s*100;)",
                         r"\1\nstatic int two_hundred = 200;", s, count=1)
          s2, n = re.subn(
              r'(\.procname\s*=\s*"swappiness".*?\.extra2\s*=\s*)&one_hundred',
              r'\1&two_hundred', s, flags=re.S)
          p.write_text(s2)
          if n == 0:
              print("::error::sysctl swappiness 上限修改失败")
              sys.exit(1)
          print("swappiness = 200 修改成功。")
          PY

      - name: Patch Power Supply (4.5V Default + Magisk Writeable)
        run: |
          echo "🔧 修补 qpnp-smb2.c：默认满电 4.5V + 允许 Magisk 写入 voltage_max..."
          python3 - << 'PYEOF'
          import re
          import sys

          FILE = "drivers/power/supply/qcom/qpnp-smb2.c"

          with open(FILE, 'r') as f:
              content = f.read()

          # ============================================================
          # Patch1: 在 smb2_init_hw() 中，把 vbatmax[BATT_TEMP_NORMAL]
          #         强制为 4500 mV，并同步 batt_profile_fv_uv + vote
          # 锚点（源码中唯一一处）：
          #     smblib_set_charge_param(chg, &chg->param.fv,
          #             chg->vbatmax[BATT_TEMP_NORMAL] * 1000);
          # ============================================================
          pat1 = r'smblib_set_charge_param\(chg, &chg->param\.fv,\s*\n\s*chg->vbatmax\[BATT_TEMP_NORMAL\] \* 1000\);'
          m1 = re.search(pat1, content)
          if not m1:
              print("❌ Patch1 失败：找不到 smb2_init_hw 中 fv set_charge_param 特征")
              print("   请在源码中执行: grep -n 'chg->param.fv' drivers/power/supply/qcom/qpnp-smb2.c")
              sys.exit(1)
          insert1 = (
              "\t/* OnePlus: force 4.5V default full-charge voltage */\n"
              "\tchg->vbatmax[BATT_TEMP_NORMAL] = 4500;\n"
              "\tchg->batt_profile_fv_uv = chg->vbatmax[BATT_TEMP_NORMAL] * 1000;\n"
              "\tvote(chg->fv_votable, BATT_PROFILE_VOTER, true, chg->batt_profile_fv_uv);\n"
          )
          content = content[:m1.start()] + insert1 + content[m1.start():]
          n1 = 1

          # ============================================================
          # Patch2: 把 POWER_SUPPLY_PROP_VOLTAGE_MAX 加入 is_writeable
          # 锚点：smb2_batt_prop_is_writeable 里
          #     case POWER_SUPPLY_PROP_STEP_CHARGING_ENABLED:
          #     case POWER_SUPPLY_PROP_SW_JEITA_ENABLED:
          #         return 1;
          # 这个组合只在 is_writeable 中出现，get/set_prop 里同名单 case
          # 后面跟的语句不一样，因此唯一。
          # ============================================================
          pat2 = r'(case POWER_SUPPLY_PROP_STEP_CHARGING_ENABLED:\s*\n\s*)(case POWER_SUPPLY_PROP_SW_JEITA_ENABLED:\s*\n\s*return 1;)'
          def repl2(_m):
              return (
                  "case POWER_SUPPLY_PROP_STEP_CHARGING_ENABLED:\n"
                  "\tcase POWER_SUPPLY_PROP_SW_JEITA_ENABLED:\n"
                  "\tcase POWER_SUPPLY_PROP_VOLTAGE_MAX:\n"
                  "\t\treturn 1;"
              )
          content, n2 = re.subn(pat2, repl2, content, count=1)
          if n2 != 1:
              print("❌ Patch2 失败：找不到 is_writeable 中 STEP_CHARGING_ENABLED/SW_JEITA_ENABLED/return 1 组合")
              sys.exit(1)

          # ============================================================
          # Patch3: VOLTAGE_MAX 被写入时同步 vbatmax[BATT_TEMP_NORMAL]
          # 锚点：smb2_batt_set_prop 中的 VOLTAGE_MAX 分支
          #     case POWER_SUPPLY_PROP_VOLTAGE_MAX:
          #         chg->batt_profile_fv_uv = val->intval;
          #         vote(chg->fv_votable, BATT_PROFILE_VOTER, true, val->intval);
          # ============================================================
          pat3 = r'(case POWER_SUPPLY_PROP_VOLTAGE_MAX:\s*\n\s*chg->batt_profile_fv_uv = val->intval;\s*\n\s*vote\(chg->fv_votable, BATT_PROFILE_VOTER, true, val->intval\);)'
          m3 = re.search(pat3, content)
          if not m3:
              print("❌ Patch3 失败：找不到 VOLTAGE_MAX set 分支")
              sys.exit(1)
          insert3 = "\n\t\tchg->vbatmax[BATT_TEMP_NORMAL] = val->intval / 1000;"
          content = content[:m3.end()] + insert3 + content[m3.end():]
          n3 = 1

          with open(FILE, 'w') as f:
              f.write(content)

          print(f"✅ qpnp-smb2.c 修补完成 (patch1={n1}, patch2={n2}, patch3={n3})")
          PYEOF

          echo "🔧 修补 op_dash_adapter.c：温度区域投票者改为 BATT_PROFILE_VOTER（可选，找不到就跳过）..."
          python3 - << 'PYEOF'
          import os
          import re

          FILE = "drivers/power/supply/qcom/op_dash_adapter.c"

          if not os.path.exists(FILE):
              print(f"⚠️ {FILE} 不存在，跳过该补丁")
              raise SystemExit(0)

          with open(FILE, 'r') as f:
              content = f.read()

          old = "DEFAULT_VOTER, true, vfloat * 1000"
          new = "BATT_PROFILE_VOTER, true, vfloat * 1000"
          n = 0

          if old in content:
              content = content.replace(old, new, 1)
              n = 1
              print("✅ 使用精确字符串替换成功")
          else:
              pat = r'DEFAULT_VOTER(\s*,\s*true\s*,\s*vfloat\s*\*\s*1000)'
              content, n = re.subn(pat, r'BATT_PROFILE_VOTER\1', content, count=1)
              if n >= 1:
                  print("✅ 使用宽松正则替换成功")

          if n < 1:
              print("⚠️ op_dash_adapter.c 中找不到目标特征，跳过该补丁")
              print(f"  DEFAULT_VOTER: {content.count('DEFAULT_VOTER')}, "
                    f"vfloat * 1000: {content.count('vfloat * 1000')}, "
                    f"fv_votable: {content.count('fv_votable')}")
              print("  qpnp-smb2.c 已独立完成 4.5V 默认值与 Magisk 写入支持，目标仍达成。")
              raise SystemExit(0)

          with open(FILE, 'w') as f:
              f.write(content)

          print("✅ op_dash_adapter.c 修补完成 (fv_votable: DEFAULT_VOTER -> BATT_PROFILE_VOTER)")
          PYEOF

      - name: Configure kernel for APatch / KPM (GCC 11)
        run: |
          make O=out ARCH=$ARCH \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               $DEFCONFIG

          # 启用 APatch 及 KPM 模块运行所需的关键内核配置，保持作者原配置不变
          ./scripts/config --file out/.config \
            -e KALLSYMS -e KALLSYMS_ALL -e KPROBES -e KPROBE_EVENTS \
            -d MODULE_SIG -d MODULE_SIG_FORCE

          make O=out ARCH=$ARCH olddefconfig

          echo "---- 关键配置校验 ----"
          for c in KALLSYMS_ALL KPROBES; do
            if grep -q "^CONFIG_${c}=y" out/.config; then
              echo "OK   CONFIG_${c}=y"
            else
              echo "::error::CONFIG_${c} 未生效"
              exit 1
            fi
          done

      - name: Build kernel (GCC 11)
        run: |
          make -j"$(nproc)" O=out ARCH=$ARCH \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image Image.gz dtbs

      - name: Pack Recovery Flashable Zip (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz anykernel/
          cp out/arch/arm64/boot/dtbs/*.dtb anykernel/ 2>/dev/null || true
          
          cd anykernel
          sed -i 's/^kernel.string=.*/kernel.string=blu_spark-Swappiness200-APatchReady/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=cheeseburger/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=dumpling/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' anykernel.sh
          
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          
          # 生成可直接在 Recovery 刷入的 zip 包
          zip -r "../op5-flashable-kernel-$(date +%Y%m%d-%H%M).zip" . -x '*.git*'

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: op5-recovery-flashable-zip
          path: op5-flashable-kernel-*.zip
          if-no-files-found: error
