name: Build Zstd 1.5.7 Module (GCC 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev build-essential \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          gcc-11-aarch64-linux-gnu g++-11-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          libelf-dev device-tree-compiler

    - name: Clean Source Tree
      run: |
        rm -rf out
        rm -f .config
        make mrproper || true

    - name: Fetch Zstd 1.5.7 Kernel Port
      run: |
        git clone --branch v1.5.7-kernel --single-branch https://github.com/facebook/zstd.git zstd-src
        mv lib/zstd lib/zstd.bak || true
        mkdir -p lib/zstd
        cp -r zstd-src/lib/* lib/zstd/
        cp zstd-src/lib/zstd.h include/linux/
        cp zstd-src/lib/zstd_errors.h include/linux/

    - name: Patch for Linux 4.4 & GCC 11 Compatibility
      run: |
        sed -i 's|#include <linux/stddef.h>|#include <stddef.h>|' lib/zstd/zstd_deps.h || true
        if ! grep -q "define fallthrough" lib/zstd/zstd_deps.h; then
          printf '#ifndef fallthrough\n#define fallthrough __attribute__((__fallthrough__))\n#endif\n' >> lib/zstd/zstd_deps.h
        fi

        cat > lib/zstd/zstd_common_module.c << 'EOF'
        #include "common/zstd_deps.h"
        #include "common/zstd_common.c"
        #include "common/error_private.c"
        #include "common/entropy_common.c"
        #include "common/fse_decompress.c"
        #include "common/debug.c"
        EXPORT_SYMBOL_GPL(ZSTD_customCalloc);
        EXPORT_SYMBOL_GPL(ZSTD_customFree);
        EOF

    - name: Patch Makefile (Force obj-m Compilation)
      run: |
        # 关键修复：不再依赖 CONFIG_ 变量，直接硬编码 obj-m 强制编译
        cat > lib/zstd/Makefile << 'EOF'
        ccflags-y += -I$(srctree)/lib/zstd -fcommon
        obj-m += zstd_compress.o
        obj-m += zstd_decompress.o
        obj-m += zstd_common.o
        zstd_common-y := zstd_common_module.o
        zstd_compress-y := zstd_compress_module.o zstd_common.o entropy_common.o fse_compress.o \
                           hist.o huf_compress.o zstd_compress.o zstd_double_fast.o \
                           zstd_fast.o zstd_lazy.o zstd_ldm.o zstd_opt.o
        zstd_decompress-y := zstd_decompress_module.o zstd_common.o entropy_common.o \
                             fse_decompress.o huf_decompress.o zstd_ddict.o zstd_decompress.o
        EOF

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        make O=out blu_spark_defconfig

        # 屏蔽 GCC 11 在老内核上的报错
        export KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -Wno-use-after-free"
        export HOSTCFLAGS="$KCFLAGS"

        make O=out olddefconfig
        make O=out modules_prepare

    - name: Compile Zstd Module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        # 编译模块
        make O=out \
             KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -fcommon" \
             M=$GITHUB_WORKSPACE/lib/zstd modules

        # 打印搜索日志，看看 .ko 到底在哪里
        echo "=== Searching for .ko files ==="
        find $GITHUB_WORKSPACE -name "*.ko"

    - name: Upload zstd.ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zstd-ko-modules-gcc11
        # 兼容两种可能的生成路径
        path: |
          out/lib/zstd/*.ko
          lib/zstd/*.ko
        if-no-files-found: error
