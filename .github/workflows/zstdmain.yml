name: Build Zstd 1.5.7 Module (GCC 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev build-essential \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          gcc-11-aarch64-linux-gnu g++-11-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          libelf-dev device-tree-compiler

    - name: Clean Source Tree
      run: |
        rm -rf out
        rm -f .config
        make mrproper || true

    - name: Fetch Zstd 1.5.7 Kernel Port
      run: |
        git clone --branch v1.5.7-kernel --single-branch https://github.com/facebook/zstd.git zstd-src
        mv lib/zstd lib/zstd.bak || true
        mkdir -p lib/zstd
        cp -r zstd-src/lib/* lib/zstd/
        cp zstd-src/lib/zstd.h include/linux/
        cp zstd-src/lib/zstd_errors.h include/linux/

    - name: Patch for Linux 4.4 & GCC 11 Compatibility
      run: |
        sed -i 's|#include <linux/stddef.h>|#include <stddef.h>|' lib/zstd/common/zstd_deps.h || true
        if ! grep -q "define fallthrough" lib/zstd/common/zstd_deps.h; then
          printf '#ifndef fallthrough\n#define fallthrough __attribute__((__fallthrough__))\n#endif\n' >> lib/zstd/common/zstd_deps.h
        fi
        # 删除 EXPORT_SYMBOL 避免冲突
        sed -i '/EXPORT_SYMBOL_GPL(ZSTD_customCalloc);/d' lib/zstd/common/zstd_common.c
        sed -i '/EXPORT_SYMBOL_GPL(ZSTD_customFree);/d' lib/zstd/common/zstd_common.c

    - name: Patch Makefile (Force Overwrite)
      run: |
        # 彻底删除旧的 Makefile
        rm -f lib/zstd/Makefile
        
        # 写入全新的 Makefile
        cat > lib/zstd/Makefile << 'EOF'
        ccflags-y += -I$(srctree)/lib/zstd -fcommon

        obj-m += zstd_compress.o
        zstd_compress-y := zstd_compress_module.o \
                           common/zstd_common.o \
                           common/entropy_common.o \
                           common/error_private.o \
                           common/fse_decompress.o \
                           common/debug.o \
                           compress/fse_compress.o \
                           compress/hist.o \
                           compress/huf_compress.o \
                           compress/zstd_compress.o \
                           compress/zstd_double_fast.o \
                           compress/zstd_fast.o \
                           compress/zstd_lazy.o \
                           compress/zstd_ldm.o \
                           compress/zstd_opt.o

        obj-m += zstd_decompress.o
        zstd_decompress-y := zstd_decompress_module.o \
                             common/zstd_common.o \
                             common/entropy_common.o \
                             common/error_private.o \
                             common/fse_decompress.o \
                             common/debug.o \
                             decompress/huf_decompress.o \
                             decompress/zstd_ddict.o \
                             decompress/zstd_decompress.o
        EOF

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        make O=out blu_spark_defconfig

        export KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -Wno-use-after-free"
        export HOSTCFLAGS="$KCFLAGS"

        make O=out olddefconfig
        make O=out modules_prepare

    - name: Compile Zstd Module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        echo "=== Verifying Makefile content ==="
        # 打印出 Makefile 前几行，确认没有 compress/ 前缀
        head -n 5 lib/zstd/Makefile

        # 编译
        make O=out \
             KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -fcommon" \
             M=$GITHUB_WORKSPACE/lib/zstd modules

        echo "=== Searching for .ko files ==="
        find $GITHUB_WORKSPACE -name "*.ko"

    - name: Upload zstd.ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zstd-ko-modules-gcc11
        path: |
          out/lib/zstd/*.ko
          lib/zstd/*.ko
        if-no-files-found: error
