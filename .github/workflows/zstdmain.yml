name: Build Zstd 1.5.7 Module (GCC 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev build-essential \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          gcc-11-aarch64-linux-gnu g++-11-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          libelf-dev device-tree-compiler

    - name: Clean Source Tree
      run: |
        rm -rf out
        rm -f .config
        make mrproper || true

    - name: Fetch Zstd 1.5.7 Kernel Port
      run: |
        git clone --branch v1.5.7-kernel --single-branch https://github.com/facebook/zstd.git zstd-src
        mv lib/zstd lib/zstd.bak || true
        mkdir -p lib/zstd
        cp -r zstd-src/lib/* lib/zstd/
        
        # 直接自己写内核封装文件，不依赖原目录
        cat > lib/zstd/zstd_compress_module.c << 'EOF'
        #include <linux/kernel.h>
        #include <linux/module.h>
        int zstd_compress_init(void) { return 0; }
        void zstd_compress_exit(void) { }
        module_init(zstd_compress_init);
        module_exit(zstd_compress_exit);
        MODULE_LICENSE("GPL");
        EOF

        cat > lib/zstd/zstd_decompress_module.c << 'EOF'
        #include <linux/kernel.h>
        #include <linux/module.h>
        int zstd_decompress_init(void) { return 0; }
        void zstd_decompress_exit(void) { }
        module_init(zstd_decompress_init);
        module_exit(zstd_decompress_exit);
        MODULE_LICENSE("GPL");
        EOF
        
        cp zstd-src/lib/zstd.h include/linux/
        cp zstd-src/lib/zstd_errors.h include/linux/

    - name: Patch for Linux 4.4 & GCC 11 Compatibility
      run: |
        # 1. 强力清洗所有标准库头文件包含，哪怕是带空格的写法
        find lib/zstd -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i -E 's|#\s*include\s*<(limits|stddef|stdint|string|stdlib)\.h>|/* removed */|g' {} +

        # 2. 彻底重写 zstd_deps.h，手动提供类型定义，不依赖任何标准库
        cat > lib/zstd/common/zstd_deps.h << 'EOF'
        #ifndef ZSTD_DEPS_COMMON
        #define ZSTD_DEPS_COMMON

        #include <linux/kernel.h>
        #include <linux/types.h>
        #include <linux/stddef.h>
        #include <linux/string.h>
        #include <linux/errno.h>
        #include <linux/vmalloc.h>
        #include <linux/slab.h>

        /* 针对老内核强补基本类型 */
        #if defined(__SIZE_TYPE__)
        typedef __SIZE_TYPE__ size_t;
        #endif
        #if defined(__PTRDIFF_TYPE__)
        typedef __PTRDIFF_TYPE__ ptrdiff_t;
        #endif

        #ifndef fallthrough
        #define fallthrough __attribute__((__fallthrough__))
        #endif

        #endif /* ZSTD_DEPS_COMMON */

        #ifndef ZSTD_DEPS_NEED_MALLOC
        #ifndef ZSTD_malloc
        #define ZSTD_malloc(x)         vmalloc(x)
        #define ZSTD_calloc(x,y)       vzalloc((x) * (y))
        #define ZSTD_free(x)           vfree(x)
        #endif
        #endif

        #define ZSTD_memcpy(d,s,n)     memcpy((d),(s),(n))
        #define ZSTD_memmove(d,s,n)    memmove((d),(s),(n))
        #define ZSTD_memset(d,s,n)     memset((d),(s),(n))
        #define ZSTD_memcmp(s1,s2,n)   memcmp((s1),(s2),(n))
        EOF

        sed -i '/EXPORT_SYMBOL_GPL(ZSTD_customCalloc);/d' lib/zstd/common/zstd_common.c
        sed -i '/EXPORT_SYMBOL_GPL(ZSTD_customFree);/d' lib/zstd/common/zstd_common.c

    - name: Patch Makefile
      run: |
        rm -f lib/zstd/Makefile
        cat > lib/zstd/Makefile << 'EOF'
        # 关键修复：使用 -include 强制预包含 zstd_deps.h，确保 size_t 等类型提前定义
        ccflags-y += -I$(srctree)/lib/zstd -I$(srctree)/lib/zstd/common -I$(srctree)/lib/zstd/compress -I$(srctree)/lib/zstd/decompress -fcommon
        ccflags-y += -include $(srctree)/lib/zstd/common/zstd_deps.h

        obj-m += zstd_compress.o
        zstd_compress-y := zstd_compress_module.o \
                           common/zstd_common.o \
                           common/entropy_common.o \
                           common/error_private.o \
                           common/fse_decompress.o \
                           common/debug.o \
                           compress/fse_compress.o \
                           compress/hist.o \
                           compress/huf_compress.o \
                           compress/zstd_compress.o \
                           compress/zstd_double_fast.o \
                           compress/zstd_fast.o \
                           compress/zstd_lazy.o \
                           compress/zstd_ldm.o \
                           compress/zstd_opt.o

        obj-m += zstd_decompress.o
        zstd_decompress-y := zstd_decompress_module.o \
                             common/zstd_common.o \
                             common/entropy_common.o \
                             common/error_private.o \
                             common/fse_decompress.o \
                             common/debug.o \
                             decompress/huf_decompress.o \
                             decompress/zstd_ddict.o \
                             decompress/zstd_decompress.o
        EOF

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        make O=out blu_spark_defconfig

        export KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -Wno-use-after-free"
        export HOSTCFLAGS="$KCFLAGS"

        make O=out olddefconfig
        make O=out modules_prepare

    - name: Compile Zstd Module
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc

        make O=out \
             KCFLAGS="-Wno-error -Wno-array-bounds -Wno-stringop-overflow -Wno-misleading-indentation -fcommon" \
             M=$GITHUB_WORKSPACE/lib/zstd modules

        echo "=== Searching for .ko files ==="
        find $GITHUB_WORKSPACE -name "*.ko"

    - name: Upload zstd.ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zstd-ko-modules-gcc11
        path: |
          out/lib/zstd/*.ko
          lib/zstd/*.ko
        if-no-files-found: error
