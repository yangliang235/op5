name: Build OP5T Kernel with ZRAM Writeback

on:
  workflow_dispatch:
  push:
    branches: [ blu_spark-10 ]
  pull_request:
    branches: [ blu_spark-10 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-10
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget zip build-essential libssl-dev libelf-dev bc bison flex

      - name: Download toolchain (GitHub hosted, 100% accessible for runner)
        run: |
          # Download prebuilt toolchain zip from GitHub, no clone issues
          wget -O toolchain.zip https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/cm-14.1.zip
          unzip -q toolchain.zip
          mv android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9-cm-14.1 toolchain
          
          # Verify toolchain files
          ls -la toolchain/bin/
          export CROSS_COMPILE=$PWD/toolchain/bin/aarch64-linux-android-
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          
          # Test compiler (FIXED: no extra dash, CROSS_COMPILE already has it!)
          $CROSS_COMPILE"gcc" --version

      - name: Configure kernel
        run: |
          export CROSS_COMPILE=$CROSS_COMPILE
          make ARCH=arm64 op5-perf_defconfig
          # Enable ZRAM Writeback config
          sed -i '/CONFIG_ZRAM_WRITEBACK/d' out/.config
          echo "CONFIG_ZRAM=y" >> out/.config
          echo "CONFIG_ZRAM_WRITEBACK=y" >> out/.config
          echo "CONFIG_ZSMALLOC=y" >> out/.config
          echo "CONFIG_TRANSPARENT_HUGEPAGE=y" >> out/.config
          make ARCH=arm64 O=out olddefconfig

      - name: Build kernel (only Image.gz-dtb, no modules to keep WiFi stock)
        run: |
          export CROSS_COMPILE=$CROSS_COMPILE
          make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=$CROSS_COMPILE Image.gz-dtb

      - name: Pack flashable zip with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          # Config for OP5/OP5T
          sed -i 's/device.name1=maguro/device.name1=cheeseburger/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=dumpling/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          zip -r9 OP5T-BluSpark-ZRAM-Writeback.zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: OP5T-Kernel-ZRAM
          path: anykernel/OP5T-BluSpark-ZRAM-Writeback.zip
