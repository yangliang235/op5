name: Build OnePlus 5/T Kernel (with ZRAM Writeback)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04   # 使用 Ubuntu 22.04 保证工具链兼容性

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1       # 只拉取最新代码，加快速度

    - name: Install cross-compilation toolchain
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          flex \
          bison \
          bc \
          kmod \
          cpio \
          device-tree-compiler \
          gcc-aarch64-linux-gnu \
          libssl-dev \
          libelf-dev

    - name: Configure kernel (enable ZRAM writeback)
      run: |
        # 进入内核源码根目录
        cd ${GITHUB_WORKSPACE}
        
        # 使用设备专用的 defconfig（根据该仓库常规命名为 op5_defconfig）
        # 如果实际文件名不同，可改为 blu_spark_defconfig 或自行列出 configs 目录
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- op5_defconfig
        
        # 启用 ZRAM 回写功能（CONFIG_ZRAM_WRITEBACK=y）
        echo "CONFIG_ZRAM_WRITEBACK=y" >> .config
        
        # 自动解决新增配置项的依赖关系（保持其他选项为默认值）
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # 可选：验证 ZRAM_WRITEBACK 是否成功启用
        grep CONFIG_ZRAM_WRITEBACK .config || echo "Warning: CONFIG_ZRAM_WRITEBACK not found"

    - name: Build kernel image and DTBs
      run: |
        cd ${GITHUB_WORKSPACE}
        # 使用所有 CPU 核心编译，减少时间
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
        # 编译设备树文件（OnePlus 5/T 需要）
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs

    - name: Prepare artifacts
      run: |
        mkdir -p kernel_out
        # 复制内核镜像（通常为 Image.gz）
        cp arch/arm64/boot/Image.gz kernel_out/ 2>/dev/null || echo "Image.gz not found"
        # 复制设备树二进制文件
        cp arch/arm64/boot/dts/qcom/*.dtb kernel_out/ 2>/dev/null || true
        # 复制任何生成的 zImage 或 Image
        cp arch/arm64/boot/Image kernel_out/ 2>/dev/null || true
        # 保存最终配置文件（便于检查）
        cp .config kernel_out/config_$(date +%Y%m%d_%H%M%S)

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: op5-kernel-zram-writeback
        path: kernel_out/
        retention-days: 7
