name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget unzip build-essential libssl-dev libelf-dev bison flex

      - name: Download LLVM toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang llvm
          cd llvm
          git checkout 659e8ec8d2702269c591db80449ca94c6e843b7a
          cd ..

      # 重要：你的源码已经在这里，不需要移动，直接使用
      - name: Apply ZRAM回写补丁
        run: |
          patch -p1 < ../zram-writeback-base.patch || true
          patch -p1 < ../zram-writeback-fix.patch || true

      - name: Build kernel with LLVM
        run: |
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              SUBARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              PATH=../llvm/bin:$PATH \
              CC=clang \
              CXX=clang++ \
              AR=llvm-ar \
              NM=llvm-nm \
              AS=llvm-as \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Download AnyKernel3
        run: |
          git clone https://github.com/Seshiria/AnyKernel3
          cd AnyKernel3
          git checkout 949ffeaee8cdb92fea6f9dbfc966ed1ef8041a3b
          cd ..

      - name: Package flashable zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../op5-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: op5-kernel
          path: op5-kernel.zip
