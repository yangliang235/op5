name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget unzip build-essential libssl-dev libelf-dev bison flex gcc-aarch64-linux-gnu

      - name: Download working LLVM toolchain
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487759.tar.gz
          tar -xf clang-r487759.tar.gz -C llvm
          rm -f clang-r487759.tar.gz

      - name: Apply ZRAM Writeback Patches
        run: |
          patch -p1 < zram-writeback-base.patch || true
          patch -p1 < zram-writeback-fix.patch || true

      - name: Build kernel with LLVM
        run: |
          make -j$(nproc) O=out \
              ARCH=arm64 \
              SUBARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              PATH=$(pwd)/llvm/bin:$PATH \
              CC=clang \
              CXX=clang++ \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Download AnyKernel3
        run: |
          git clone https://github.com/Seshiria/AnyKernel3
          cd AnyKernel3
          git checkout 949ffeaee8cdb92fea6f9dbfc966ed1ef8041a3b
          cd ..

      - name: Package flashable zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../op5-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: op5-kernel
          path: op5-kernel.zip
