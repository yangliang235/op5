name: Build Kernel & Create Flashable ZIP (ZRAM Writeback)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install cross-compilation toolchain
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          flex \
          bison \
          bc \
          kmod \
          cpio \
          device-tree-compiler \
          gcc-aarch64-linux-gnu \
          libssl-dev \
          libelf-dev \
          lz4 \
          lzop \
          xz-utils

    - name: Deep clean kernel source tree
      run: |
        cd ${GITHUB_WORKSPACE}
        # 删除所有可能的输出目录
        rm -rf out build
        # 清理所有自动生成的文件
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- mrproper
        # 手动删除残留
        rm -f .config .config.old .version Module.symvers
        rm -rf include/config include/generated scripts/basic scripts/kconfig
        rm -rf arch/arm64/include/generated

    - name: Configure kernel (enable ZRAM writeback)
      run: |
        cd ${GITHUB_WORKSPACE}
        
        echo "Available defconfigs:"
        ls arch/arm64/configs/*defconfig 2>/dev/null
        
        if [ -f arch/arm64/configs/blu_spark_defconfig ]; then
          DEFCONFIG=blu_spark_defconfig
        elif [ -f arch/arm64/configs/op5_defconfig ]; then
          DEFCONFIG=op5_defconfig
        elif [ -f arch/arm64/configs/oneplus5_defconfig ]; then
          DEFCONFIG=oneplus5_defconfig
        else
          DEFCONFIG=$(ls arch/arm64/configs/*defconfig 2>/dev/null | head -1 | xargs basename)
          if [ -z "$DEFCONFIG" ]; then
            echo "Error: No defconfig found in arch/arm64/configs/"
            exit 1
          fi
        fi
        
        echo "Using defconfig: $DEFCONFIG"
        
        # 强制在当前目录编译（O=.）
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=. $DEFCONFIG
        echo "CONFIG_ZRAM_WRITEBACK=y" >> .config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=. olddefconfig
        grep CONFIG_ZRAM_WRITEBACK .config || echo "Warning: CONFIG_ZRAM_WRITEBACK not found"

    - name: Build kernel and dtbs
      run: |
        cd ${GITHUB_WORKSPACE}
        # 强制在当前目录编译（O=.）
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=. -j$(nproc)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=. dtbs

    - name: Prepare kernel image for AnyKernel3
      run: |
        cd ${GITHUB_WORKSPACE}
        mkdir -p AnyKernel3
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cat arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
        else
          cp arch/arm64/boot/Image AnyKernel3/Image
          cat arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
        fi

    - name: Clone AnyKernel3 template
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp -rf AnyKernel3/* ${GITHUB_WORKSPACE}/AnyKernel3/ 2>/dev/null || true

    - name: Customize AnyKernel3 for OnePlus 5/T
      run: |
        cd ${GITHUB_WORKSPACE}/AnyKernel3
        sed -i 's/device.name1=.*/device.name1=OnePlus5/' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=OnePlus5T/' anykernel.sh
        sed -i 's|block=/dev/block/bootdevice/by-name/.*|block=/dev/block/bootdevice/by-name/kernel|' anykernel.sh
        echo "# ZRAM writeback enabled in kernel config" >> anykernel.sh

    - name: Create flashable ZIP
      run: |
        cd ${GITHUB_WORKSPACE}/AnyKernel3
        zip -r9 ../op5_kernel_zram_writeback_$(date +%Y%m%d_%H%M%S).zip * -x .git README.md
        mkdir -p ${GITHUB_WORKSPACE}/output
        mv ../op5_kernel_zram_writeback_*.zip ${GITHUB_WORKSPACE}/output/

    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: op5-kernel-flashable-zip
        path: output/*.zip
        retention-days: 7
