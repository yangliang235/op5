name: Build OP5T Kernel with ZRAM Writeback

on:
  workflow_dispatch:
  push:
    branches: [ blu_spark-10 ]
  pull_request:
    branches: [ blu_spark-10 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-10
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget zip build-essential libssl-dev libelf-dev bc bison flex

      - name: Download toolchain (Proton Clang 17, 安卓内核通用)
        run: |
          wget -O clang.tar.gz https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar xf clang.tar.gz
          mv proton-clang-master toolchain
          
          ls -la toolchain/bin/
          export CROSS_COMPILE=$PWD/toolchain/bin/aarch64-linux-gnu-
          export CC=$PWD/toolchain/bin/clang
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          
          $CC --version

      - name: Configure kernel
        run: |
          make ARCH=arm64 op5-perf_defconfig
          # 手机不需要ACPI，直接关掉避免编译错误
          sed -i 's/CONFIG_ACPI=y/CONFIG_ACPI=n/' out/.config
          make ARCH=arm64 O=out olddefconfig

      - name: Build kernel
        run: |
          export CROSS_COMPILE=$CROSS_COMPILE
          export CC=$CC
          # 用Clang编译，兼容性更好，不会有GCC的那些老代码警告问题
          make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=$CROSS_COMPILE CC=$CC KCFLAGS="-Wno-error" Image.gz-dtb

      - name: Pack flashable zip with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          # 适配OP5/OP5T，不刷模块，保证WiFi正常
          sed -i 's/device.name1=maguro/device.name1=cheeseburger/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=dumpling/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          zip -r9 OP5T-BluSpark-ZRAM-Writeback.zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: OP5T-Kernel-ZRAM
          path: anykernel/OP5T-BluSpark-ZRAM-Writeback.zip
