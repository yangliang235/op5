        #        # 添加 添加标记
标记
        echo        echo "# Z "# ZRAM writeRAM writeback enabledback enabled in kernel in kernel config" config" >> any >> anykernel.shkernel.sh

   

    - name - name: Create: Create flashable flashable ZIP
