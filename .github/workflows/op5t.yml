name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 👇 这行保证手动运行按钮出现
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget unzip build-essential libssl-dev libelf-dev bison flex

      # 👇 修复 LLVM 克隆报错（完整克隆，不浅克隆）
      - name: Download LLVM toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang llvm
          cd llvm
          git checkout 659e8ec8d2702269c591db80449ca94c6e843b7a
          cd ..

      # 👇 直接用你自己仓库的源码 yangliang235/op5
      - name: Use your kernel source
        run: |
          mv $(pwd) kernel

      # 👇 你要求：不打任何补丁，只保留原有代码 + ZRAM回写源码
      - name: Apply ZRAM回写补丁
        run: |
          cd kernel
          patch -p1 < ../zram-writeback-base.patch || true
          patch -p1 < ../zram-writeback-fix.patch || true

      - name: Build kernel with LLVM
        run: |
          cd kernel
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              SUBARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              PATH=../llvm/bin:$PATH \
              CC=clang \
              CXX=clang++ \
              AR=llvm-ar \
              NM=llvm-nm \
              AS=llvm-as \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Download AnyKernel3
        run: |
          git clone https://github.com/Seshiria/AnyKernel3
          cd AnyKernel3
          git checkout 949ffeaee8cdb92fea6f9dbfc966ed1ef8041a3b
          cd ..

      - name: Package flashable zip
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../op5-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: op5-kernel
          path: op5-kernel.zip
