name: Build Kernel & Create Flashable ZIP (ZRAM Writeback)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install cross-compilation toolchain
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          flex \
          bison \
          bc \
          kmod \
          cpio \
          device-tree-compiler \
          gcc-aarch64-linux-gnu \
          libssl-dev \
          libelf-dev \
          lz4 \
          lzop \
          xz-utils

    - name: Configure kernel (enable ZRAM writeback)
      run: |
        cd ${GITHUB_WORKSPACE}
        
        # 列出所有可用的 defconfig 文件
        echo "Available defconfigs:"
        ls arch/arm64/configs/*defconfig 2>/dev/null || ls arch/arm64/configs/*_defconfig 2>/dev/null
        
        # 自动选择合适的 defconfig（优先级：blu_spark_defconfig > op5_defconfig > oneplus5_defconfig > 任意第一个）
        if [ -f arch/arm64/configs/blu_spark_defconfig ]; then
          DEFCONFIG=blu_spark_defconfig
        elif [ -f arch/arm64/configs/op5_defconfig ]; then
          DEFCONFIG=op5_defconfig
        elif [ -f arch/arm64/configs/oneplus5_defconfig ]; then
          DEFCONFIG=oneplus5_defconfig
        else
          # 获取第一个 *defconfig 文件
          DEFCONFIG=$(ls arch/arm64/configs/*defconfig 2>/dev/null | head -1 | xargs basename)
          if [ -z "$DEFCONFIG" ]; then
            echo "Error: No defconfig found in arch/arm64/configs/"
            exit 1
          fi
        fi
        
        echo "Using defconfig: $DEFCONFIG"
        
        # 加载默认配置
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG
        
        # 启用 ZRAM 回写功能
        echo "CONFIG_ZRAM_WRITEBACK=y" >> .config
        
        # 解决依赖并生成最终配置
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # 验证选项已开启
        grep CONFIG_ZRAM_WRITEBACK .config || echo "Warning: CONFIG_ZRAM_WRITEBACK not found"

    - name: Build kernel and dtbs
      run: |
        cd ${GITHUB_WORKSPACE}
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs

    - name: Prepare kernel image for AnyKernel3
      run: |
        cd ${GITHUB_WORKSPACE}
        mkdir -p AnyKernel3
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cat arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
        else
          cp arch/arm64/boot/Image AnyKernel3/Image
          cat arch/arm64/boot/dts/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
        fi

    - name: Clone AnyKernel3 template
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp -rf AnyKernel3/* ${GITHUB_WORKSPACE}/AnyKernel3/ 2>/dev/null || true

    - name: Customize AnyKernel3 for3 for OnePlus OnePlus 5/T
