name: Build OP5T Kernel with ZRAM Writeback

on:
  workflow_dispatch:
  push:
    branches: [ blu_spark-10 ]
  pull_request:
    branches: [ blu_spark-10 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-10
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget zip build-essential libssl-dev libelf-dev bc bison flex

      - name: Download toolchain (Gitee mirror, fast speed)
        run: |
          wget -q -O toolchain.zip https://gitee.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/master.zip
          unzip -q toolchain.zip
          mv android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9-master toolchain
          export CROSS_COMPILE=$PWD/toolchain/bin/aarch64-linux-android-
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export CROSS_COMPILE=$CROSS_COMPILE
          make ARCH=arm64 op5-perf_defconfig
          # Enable ZRAM Writeback config
          sed -i '/CONFIG_ZRAM_WRITEBACK/d' .config
          echo "CONFIG_ZRAM=y" >> .config
          echo "CONFIG_ZRAM_WRITEBACK=y" >> .config
          echo "CONFIG_ZSMALLOC=y" >> .config
          echo "CONFIG_TRANSPARENT_HUGEPAGE=y" >> .config
          make ARCH=arm64 olddefconfig

      - name: Build kernel (only Image.gz-dtb, no modules to keep WiFi stock)
        run: |
          export CROSS_COMPILE=$CROSS_COMPILE
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE Image.gz-dtb

      - name: Pack flashable zip with AnyKernel3
        run: |
          wget -q -O anykernel.zip https://gitee.com/osm0sis/AnyKernel3/archive/master.zip
          unzip -q anykernel.zip
          mv AnyKernel3-master anykernel
          cp arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          # Config for OP5T
          sed -i 's/device.name1=maguro/device.name1=cheeseburger/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=dumpling/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          zip -r9 OP5T-BluSpark-ZRAM-Writeback.zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: OP5T-Kernel-ZRAM
          path: anykernel/OP5T-BluSpark-ZRAM-Writeback.zip
